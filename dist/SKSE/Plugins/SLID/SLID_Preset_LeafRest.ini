; =============================================================================
; SLID Preset: Leaf Rest
; https://www.nexusmods.com/skyrimspecialedition/mods/15191
; =============================================================================
;
; Pre-configured Link for Leaf Rest, a crafting-focused treehouse home.
; Activates via MCM (Link page) or when casting Create Link on any container
; in the home.
;
; Leaf Rest organises crafting, alchemy, enchanting and cooking into dedicated
; containers. This preset routes those categories to their proper homes and
; keeps weapons, armour and food in the master Strong Box for you to place —
; the home has no general weapon rack or armour wardrobe, so auto-routing them
; would be a guess. Leaf Rest's per-ingredient cooking containers (Salmon,
; Cabbage, Milk, …) are intentionally left to the home's own cooking system
; (and SCIE, if installed) rather than fought over by SLID.
;
; Master: Strong Box. 20 containers tagged, 16 with filter assignments.
; Container FormIDs verified against LeafRest OnePiece.esp (persistent refs).

[Preset:Leaf Rest]
RequirePlugin = LeafRest OnePiece.esp
Master = LeafRest OnePiece.esp|0x052025     ; Strong Box (master)
Description = Routes crafting materials, alchemy, enchanting, valuables and books to Leaf Rest's dedicated containers. Weapons, armour and food stay in the master Strong Box for you to sort. The home's individual cooking-ingredient containers are left to its own cooking system.
Notice = Leaf Rest's per-ingredient cooking containers are not used by this preset — food stays in the master so it doesn't fight Leaf Rest's cooking storage. You can assign food filters manually after activation if you prefer.

; -----------------------------------------------------------------------------
; Filter assignments
; -----------------------------------------------------------------------------
; Key = SLID filter ID, Value = container reference, "Keep", or "Pass".
; Unlisted filters pass through to the master. Safety filters first.

[Preset:Leaf Rest:Filters]

; --- Safety (top of pipeline) ---
unique_items       = Keep                                   ; stay in master
enchanted_items    = Keep                                   ; stay in master

; --- Weapons & Armour ---
; No general weapon rack or armour wardrobe in Leaf Rest — these stay in master.
weapons            = Keep                                   ; stay in master (no weapon container)
armor              = Keep                                   ; stay in master (slot-based tempering bins don't map to weight class)
shields            = LeafRest OnePiece.esp|0x06A02E         ; Shield

; --- Valuables ---
valuables          = LeafRest OnePiece.esp|0x05DB1E         ; Safe
gems               = LeafRest OnePiece.esp|0x05DB1E         ; Safe
rings              = LeafRest OnePiece.esp|0x054EFA         ; Jewelry Box
amulets            = LeafRest OnePiece.esp|0x054EFA         ; Jewelry Box
soul_gems          = LeafRest OnePiece.esp|0x06A03B         ; SoulGem

; --- Consumables ---
potions            = LeafRest OnePiece.esp|0x06A039         ; Potions
poisons            = LeafRest OnePiece.esp|0x07596E         ; Poison
ingredients        = LeafRest OnePiece.esp|0x06A037         ; Ingredients
; food_cooked / food_raw left unassigned — Leaf Rest sorts food per-ingredient.

; --- Books ---
spell_tomes        = LeafRest OnePiece.esp|0x06A030         ; Spell Tome
scrolls            = LeafRest OnePiece.esp|0x06A02F         ; Scroll
; books / skill_books / notes left in master — no general bookshelf.

; --- Crafting Materials ---
ingots             = LeafRest OnePiece.esp|0x06A028         ; Ingot
ores               = LeafRest OnePiece.esp|0x06A029         ; Ore
pelts_hides        = LeafRest OnePiece.esp|0x06A02A         ; Pelt and Leather
leathers           = LeafRest OnePiece.esp|0x06A02A         ; Pelt and Leather
building_materials = LeafRest OnePiece.esp|0x06A031         ; Firewood

CatchAll           = Keep                                   ; unmatched items stay in master

; -----------------------------------------------------------------------------
; Container display names (shown in SLID config menu)
; -----------------------------------------------------------------------------

[Preset:Leaf Rest:Tags]
LeafRest OnePiece.esp|0x052025 = Strong Box        ; master — general storage
LeafRest OnePiece.esp|0x05DB1E = Safe              ; valuables & gems
LeafRest OnePiece.esp|0x054EFA = Jewelry Box       ; rings & amulets
LeafRest OnePiece.esp|0x06A03B = Soul Gems         ; enchanting area
LeafRest OnePiece.esp|0x06A039 = Potions           ; alchemy area
LeafRest OnePiece.esp|0x07596E = Poison            ; alchemy area
LeafRest OnePiece.esp|0x06A037 = Ingredients       ; alchemy area
LeafRest OnePiece.esp|0x06A030 = Spell Tomes       ; study
LeafRest OnePiece.esp|0x06A02F = Scrolls           ; study
LeafRest OnePiece.esp|0x06A028 = Ingots            ; smithing area
LeafRest OnePiece.esp|0x06A029 = Ore               ; smithing area
LeafRest OnePiece.esp|0x06A02A = Pelt and Leather  ; smithing area
LeafRest OnePiece.esp|0x06A031 = Firewood          ; smithing area
LeafRest OnePiece.esp|0x06A02E = Shield            ; smithing area (tempering)

; --- Useful extras (no filter assignment — available for manual config) ---
LeafRest OnePiece.esp|0x06A02B = Helm              ; smithing area (tempering)
LeafRest OnePiece.esp|0x06A02C = Boots             ; smithing area (tempering)
LeafRest OnePiece.esp|0x06A02D = Gauntlets         ; smithing area (tempering)
LeafRest OnePiece.esp|0x06AB80 = Recipes           ; cooking area
LeafRest OnePiece.esp|0x06595D = Dwemer Artifacts  ; display collection

; -----------------------------------------------------------------------------
; Whoosh categories (drain from inventory on Whoosh)
; -----------------------------------------------------------------------------
; Only families that actually route somewhere — weapons/armour/food stay put.

[Preset:Leaf Rest:Whoosh]
valuables          = true
consumables        = true
crafting_materials = true
books              = true
