; =======================================================================
; SLID — Niflholm: Hall Under the Mountain Container List
; =======================================================================
;
; Makes the named storage containers in Niflholm available in the SLID
; container picker for any Link. Assign filters to sort items directly
; into Niflholm's built-in storage system.
;
; Only persistent containers are included (29 of 55). Non-persistent
; containers (Sell Cupboard, Drop Cupboard, Safe, Weapons barrel,
; Follower Possessions, Bed Storage, Kitchen Dresser) are excluded
; because they cannot be resolved when outside the cell.
;
; FormIDs are persistent reference IDs (REFR) in Niflholm.esp.
; Verified with ESMA against Niflholm v0.9.1.
;
; =======================================================================

[ContainerList:Niflholm]
RequirePlugin = Niflholm.esp
Description = Named storage containers from Niflholm - Hall Under the Mountain.

